# Build the self-contained dist/index.html and publish it to GitHub Pages.
# Settings -> Pages -> Source must be "GitHub Actions" (configure-pages tries to set that itself).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than shipping a half-built page.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22.18+ runs the project's .ts tools with no build step
          cache: npm
      - run: npm ci
      # The same gates as `npm run check`, without the smoke test: that one drives a real browser.
      - run: npm run typecheck
      - run: npm run sim
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
